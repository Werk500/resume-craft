# 全套容器化：mysql + redis + nacos + 5 个后端服务 + 前端
#
# 使用：
#   docker compose -f docker-compose.full.yml up -d --build
#   前端 http://localhost:3001   网关 http://localhost:8080
#
# 说明：
# - 中间件只在容器网络内暴露，不映射宿主机端口，避免与本机已安装的服务冲突
# - 需要能正常拉取 nacos/nacos-server 镜像；内网受限时可改用 docker-compose.app.yml
# - AI_API_KEY 等从根目录 .env 读取（未配置时使用占位值，AI 功能不可用）

name: resume-craft-full

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: resume_craft
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v2.3.0
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m

  # 向量库：pgvector 官方镜像已内置 vector 扩展
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: resume_craft_vector
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 容器首次初始化时自动启用扩展并建表
      - ./apps/server/db/pgvector_schema.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_craft_vector"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Kafka（KRaft 模式，无需 ZooKeeper）
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  auth-service:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        MODULE: auth
        JAR_NAME: resumecraft-auth-0.1.0-SNAPSHOT.jar
    environment: &full-env
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "123456"
      NACOS_ADDR: nacos:8848
      AI_API_KEY: ${AI_API_KEY:-sk-placeholder}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      PG_URL: jdbc:postgresql://postgres:5432/resume_craft_vector
      PG_USER: postgres
      PG_PASSWORD: "123456"
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-before-prod-32bytes}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  resume-service:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        MODULE: resume
        JAR_NAME: resumecraft-resume-0.1.0-SNAPSHOT.jar
    environment: *full-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  job-match-service:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        MODULE: job-match
        JAR_NAME: resumecraft-job-match-0.1.0-SNAPSHOT.jar
    environment: *full-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  application-service:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        MODULE: application
        JAR_NAME: resumecraft-application-0.1.0-SNAPSHOT.jar
    environment: *full-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  gateway:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        MODULE: gateway
        JAR_NAME: resume-craft-gateway-0.1.0-SNAPSHOT.jar
    environment: *full-env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        GATEWAY_URL: http://gateway:8080
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "3001:3001"
    depends_on:
      gateway:
        condition: service_started

volumes:
  mysql-data:
  pg-data:
  kafka-data:
