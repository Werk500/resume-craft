# ============================================================
# API 网关配置（微服务 Step 2）
# 统一入口 :8080，路由到注册在 Nacos 的各业务服务
# ============================================================
server:
  port: 8080

spring:
  application:
    name: resume-craft-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:common.yml?group=COMMON
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
      config:
        file-extension: yml
        refresh-enabled: true
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:3001"
                  - "http://127.0.0.1:3001"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/oauth2/**
              filters:
                - StripPrefix=0
            - id: resume-service
              uri: lb://resume-service
              predicates:
                - Path=/api/v1/resume/**,/api/v1/diagnose/**,/api/v1/optimize/**,/api/v1/version/**,/api/v1/chat/**
              filters:
                - StripPrefix=0
            - id: job-match-service
              uri: lb://job-match-service
              predicates:
                - Path=/api/v1/job/**,/api/v1/match/**
              filters:
                - StripPrefix=0
            - id: application-service
              uri: lb://application-service
              predicates:
                - Path=/api/v1/application/**
              filters:
                - StripPrefix=0
            - id: actuator-health
              uri: lb://auth-service
              predicates:
                - Path=/actuator/health
              filters:
                - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always

