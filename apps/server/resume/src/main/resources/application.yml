# ============================================================
# resume-service 配置（Step 3 独立服务）:8082
# 简历上传解析 / AI 诊断 / 一键优化 + /internal 供 Feign
# ============================================================
server:
  port: 8082

spring:
  application:
    name: resume-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_craft?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      timeout: 5000ms
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.3
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  ai:
    mock: false
    timeout:
      chat-seconds: 60      # 诊断 / 一键优化 / 定向优化（一次性调用）
      stream-seconds: 90    # SSE 流式（诊断流式、对话创建）
      ocr-seconds: 120      # 图片 OCR（视觉模型更慢）
    retry:
      max-attempts: 2       # 含首次的总尝试次数
  storage:
    upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-before-prod-32bytes}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
    # 内部服务调用 Token（用于 Feign 调用其他微服务的 /internal/** 接口）
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.resumecraft: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
