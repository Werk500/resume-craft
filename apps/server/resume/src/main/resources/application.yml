# ============================================================
# resume-service 配置（Step 3 独立服务）:8082
# 简历上传解析 / AI 诊断 / 一键优化 + /internal 供 Feign
# ============================================================
server:
  port: 8082

spring:
  application:
    name: resume-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # optional 前缀：Nacos 不可用时服务照常启动，配置中心不应成为单点故障
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:common.yml?group=COMMON
  cloud:
    nacos:
      # server-addr 必须在根级：discovery 与 config 共用
      # 只写在 discovery 下会导致 config 模块的 serverAddr 为 null，拉取配置失败
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
      config:
        file-extension: yml
        refresh-enabled: true
