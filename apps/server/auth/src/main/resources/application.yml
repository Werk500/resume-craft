# ============================================================
# auth-service 配置（Step 3 独立服务）:8081
# ============================================================
server:
  port: 8081

spring:
  application:
    name: auth-service
    # 环境隔离：不同环境加载不同的 Data ID（auth-service-dev.yml / auth-service-prod.yml）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # optional 前缀：Nacos 不可用时服务照常启动，配置中心不该是单点故障
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:common.yml?group=COMMON
  cloud:
    nacos:
      # server-addr 放在根级：discovery 与 config 共用，只写一处
      # 若只写在 discovery 下，config 模块的 NacosConfigProperties.serverAddr 会是 null，
      # 导致拉取配置失败（日志表现为 serverAddr='null'）
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
      config:
        file-extension: yml
        refresh-enabled: true




