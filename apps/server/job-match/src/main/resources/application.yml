# ============================================================
# job-match-service 配置（Step 3 独立服务）:8083
# 岗位管理 / JD解析 / AI匹配（匹配需 Feign 调 resume-service 取简历）
# ============================================================
server:
  port: 8083

spring:
  application:
    name: job-match-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_craft?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      timeout: 5000ms
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.3
    mock: false
    timeout:
        chat-seconds: 30      # 匹配语义评分：超时会降级为 50 分，不宜过长
        stream-seconds: 60
        ocr-seconds: 120
    retry:
        max-attempts: 1       # 匹配是轻量调用，不重试
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 30000
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  ai:
    mock: false
    timeout:
      chat-seconds: 30      # 匹配语义评分：超时降级为 50 分，不宜过长
      stream-seconds: 60
      ocr-seconds: 120
    retry:
      max-attempts: 1       # 匹配是轻量调用，不重试
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-before-prod-32bytes}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
    # 内部服务调用 Token（用于 Feign 调用其他微服务的 /internal/** 接口）
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.resumecraft: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
