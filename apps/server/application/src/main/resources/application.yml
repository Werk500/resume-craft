# ============================================================
# application-service 配置（Step 3 独立服务）:8084
# 投递记录 CRUD（版本内容 Feign 调 resume-service）
# ============================================================
server:
  port: 8084

spring:
  application:
    name: application-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # optional 前缀：Nacos 不可用时服务照常启动，配置中心不应成为单点故障
      - optional:nacos:${spring.application.name}.yml
      - optional:nacos:common.yml?group=COMMON
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 1000ms
  cloud:
    nacos:
      # server-addr 必须在根级：discovery 与 config 共用
      # 只写在 discovery 下会导致 config 模块的 serverAddr 为 null，拉取配置失败
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
      config:
        file-extension: yml
        refresh-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-before-prod-32bytes}
    expire-seconds: ${JWT_EXPIRE_SECONDS:1800}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 业务拒绝不应拉高失败率，只有真正的下游故障才触发熔断。
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    instances:
      resumeService:
        base-config: default
      jobService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
    instances:
      resumeService:
        base-config: default
      jobService:
        base-config: default
