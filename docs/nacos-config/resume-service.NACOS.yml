# ============================================================
# Nacos service config -- PUBLISH THIS CONTENT TO NACOS
#
# Data ID : resume-service.yml
# Group   : DEFAULT_GROUP
# Format  : YAML
#
# WARNING: keep ASCII-only. nacos-client 2.4.2 reads remote config
# with a non-UTF-8 charset; non-ASCII characters cause:
#   YAMLException: MalformedInputException: Input length = 1
# ============================================================

spring:
  # ---------- MySQL ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/resume_craft?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

  sql:
    init:
      mode: always

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      timeout: 5000ms

  # ---------- Spring AI (chat only; embedding lives in job-match) ----------
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.3

  # ---------- File upload limits ----------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ---------- Kafka producer (embedding task) ----------
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      properties:
        # cap the block when Kafka is unreachable so upload stays fast
        max.block.ms: 3000

  # ---------- Feign (calls job-match for vector cleanup) ----------
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

# ---------- Circuit breaker around job-match calls ----------
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      jobMatchService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      jobMatchService:
        base-config: default

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  ai:
    mock: false
    timeout:
      # diagnosis / one-shot optimize
      chat-seconds: 60
      # SSE streaming
      stream-seconds: 90
      # multimodal OCR (slower)
      ocr-seconds: 120
    retry:
      max-attempts: 2
  storage:
    upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-before-prod-32bytes}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
